# In-memory H2 database: no MySQL needed. Data is lost on restart.
spring.datasource.url=jdbc:h2:mem:securityapp;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
